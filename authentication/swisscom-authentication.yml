- surface: api.swisscom.com-marketplace-gateway
  spec: null
  types: [apiKey, oauth2]
  detail: >-
    A client_id header authenticates the messaging products (Text Messaging, Token Validation,
    added-value SMS short-ID lookups). OAuth 2.0 client credentials authenticate the Mobility
    Insights products (Heatmaps, Dwell Times, Origin Destination). The legacy Voice APIs use
    authorization-code or implicit grants via https://consent.swisscom.com. The Swiss AI Platform
    inference endpoints are API-key authenticated and require a signed service contract.

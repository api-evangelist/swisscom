versioning:
  scheme: semver-product
  current: 2.17.0
  docs: https://sign.swisscom.ch/docs/guide/release-notes
  note: >-
    The Swisscom Sign Integration API is versioned as a product (semver, "Related API version" per
    release note) rather than in the URI — every operation lives under the unversioned
    /api/process path on https://sign.swisscom.ch/system. The api.swisscom.com marketplace
    gateway versions in the URI path instead (/messaging/v1/..., /voice/v1/...), and the Heatmaps
    product versions with an scs-version request header. The All-in Signing Service uses a URI
    path version (/AIS-Server/rs/v1.0) with the OpenAPI document declaring version 3.

  deprecation_header: false
  deprecated_operations: []
  note: >-
    No RFC 8594 Sunset/Deprecation header support and no written deprecation or breaking-change
    policy was found on any Swisscom API surface. Deprecations are announced ad hoc in the Swisscom
    Sign release notes with a hard date (for example the portal app-login phase-out effective
    1 March 2026). No operation in either published OpenAPI carries deprecated: true. Historically
    the legacy developer programme (developer.swisscom.com, the Cloud Foundry Application Cloud,
    the swisscom-developer GitHub SDKs) was retired without a public sunset notice, and the
    Messaging/Voice API wiki has not been touched since 2016.

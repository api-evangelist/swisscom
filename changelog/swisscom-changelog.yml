method: searched
source: https://sign.swisscom.ch/docs/guide/release-notes
scope: >-
  Swisscom Sign Integration API. This is the only Swisscom API surface with a dated, public,
  API-versioned changelog. The Digital Marketplace (digital.swisscom.com), the api.swisscom.com
  gateway products and the legacy Voice/Messaging wiki publish no changelog; Swisscom Trust
  Services publishes product news on its Trust Blog but no release notes for the AIS interface.
scheme: semver
version_signal: >-
  Each release-note item names the "Related API version" of the Swisscom Sign Integration API in
  which it shipped; portal-only changes are explicitly flagged as having no API impact.
current_version: 2.17.0
current_version_evidence: highest "Related API version" named in the June 2026 release notes
cadence: irregular, roughly every 2-3 months

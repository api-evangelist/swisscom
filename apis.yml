aid: swisscom
url: https://raw.githubusercontent.com/api-evangelist/swisscom/refs/heads/main/apis.yml
name: Swisscom
kind: company
description: >-
  Swisscom is Switzerland's largest telecommunications provider and the incumbent
  mobile network operator, fixed-line carrier and IT services company for the Swiss
  market, majority-owned by the Swiss Confederation and also operating Fastweb in
  Italy. In the telecom value chain it is a facilities-based MNO that owns the radio
  access and core network, sells mobile, broadband, TV and enterprise IT, and monetises
  network-derived data. Its API posture is unusual for a European incumbent: alongside
  the expected partner-gated enterprise surface it runs a genuine first-party API
  marketplace at digital.swisscom.com listing ten productive API products (SMS, SMS
  token 2FA, inbound SMS, mobility heatmaps, dwell times, origin-destination, NATEL go
  smart catalogs, AI inference endpoints and a business identity validator) served from
  a live api.swisscom.com gateway, plus a separately maintained, actively released
  Swisscom Sign Integration API with a downloadable OpenAPI 3.1 document. The catch is
  that every API reference, key and spec beyond Swisscom Sign sits behind a Swisscom
  login and, for several products, a signed service contract — the marketplace is a
  storefront, not open documentation. On network APIs Swisscom was one of the 21
  founding signatories of the GSMA Open Gateway Memorandum of Understanding in February
  2023, but it publishes no CAMARA API, no Open Gateway developer portal and no
  callable network-API endpoint; developers who want SIM-swap or phone-verification
  signals from the Swisscom network have historically reached them through third-party
  channels such as IPification rather than from Swisscom directly. Its legacy developer
  programme (developer.swisscom.com, the Cloud Foundry Application Cloud, the
  swisscom-developer GitHub SDKs) is dead or redirected, and the older Messaging and
  Voice APIs are still documented only as RAML-rendered HTML in a GitHub wiki.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

- aid: swisscom:swiss-ai-platform-inference-api
  name: Swiss AI Platform Inference Endpoints API
  description: >-
    OpenAI-compatible inference endpoints for chat, multimodal, audio, embedding,
    reasoning and guardrail models hosted by Swisscom on NVIDIA SuperPod infrastructure
    in Switzerland, including Meta Llama, OpenAI GPT OSS, NVIDIA models and the Apertus

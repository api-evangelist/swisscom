- aid: swisscom:swisscom-heatmaps-api
  name: Swisscom Heatmaps API
  description: >-
    Mobility Insights API returning estimated population density per 100m x 100m tile
    per hour across the whole of Switzerland, from yesterday back two years on a rolling
    window, with socio-demographic splits by gender and age band. OAuth 2.0
    client-credentials, versioned with an scs-version header. A free demo plan and a
    public Python client sample are published.
  humanURL: https://digital.swisscom.com/products/heatmaps
  baseURL: https://api.swisscom.com/layer/heatmaps/demo
  tags:
  - Mobility Data
  - Population Density
  - Geospatial
  - Analytics
  properties:
  - type: Documentation
    url: https://digital.swisscom.com/products/heatmaps
  - type: SampleCode
    url: https://github.com/swisscom/mip/blob/master/query_swisscom_heatmaps_api.py
  - type: Plans
    url: https://digital.swisscom.com/products/heatmaps/plans
- aid: swisscom:swisscom-dwell-times-api
  name: Swisscom Dwell Times API
  description: >-
    Mobility Insights API returning a frequency distribution of observed dwell times
    per 500m x 500m tile per day across Switzerland, bucketed from 0-5 minutes up to
    8-24 hours, for any day within a rolling two-year window.
  humanURL: https://digital.swisscom.com/products/dwelltimes
  tags:
  - Mobility Data
  - Geospatial
  - Analytics
  properties:
  - type: Documentation
    url: https://digital.swisscom.com/products/dwelltimes
- aid: swisscom:swisscom-origin-destination-api
  name: Swisscom Origin Destination API
  description: >-
    Mobility Insights API estimating the number of trips people make between two Swiss
    regions for weekdays and weekends over a full calendar month, including the share
    made by train, queryable by 1km tile, postal code or NPVM passenger transport zone.
  humanURL: https://digital.swisscom.com/products/origin-destination
  tags:
  - Mobility Data
  - Transport
  - Geospatial
  - Analytics
  properties:
  - type: Documentation
    url: https://digital.swisscom.com/products/origin-destination
- aid: swisscom:swisscom-smart-catalogs-natel-go-api
  name: Swisscom Smart Catalogs for NATEL go API
  description: >-
    Business/wholesale provisioning API covering the full NATEL go mobile subscription
    procurement lifecycle — activations, number portability, option and roaming
    configuration, SIM and eSIM ordering with real-time activation and PUK retrieval,
    inventory and reporting — so enterprise customers and partners can automate
    Swisscom mobile estate management from their own systems.
  humanURL: https://digital.swisscom.com/products/smartcatalogs-natelgo

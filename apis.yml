apis:
- aid: swisscom:swisscom-sign-integration-api
  name: Swisscom Sign Integration API
  description: >-
    REST API that lets backend systems create, configure, release and monitor digital
    signature processes end to end — create a process, attach PDF documents, invite
    signers, release it, poll status and download the signed documents and the audit
    record. Secured with OAuth 2.0 client credentials against a Swisscom Keycloak realm
    with fine-grained sswp:process:* scopes. This is the only Swisscom API found with a
    publicly downloadable machine-readable specification.
  humanURL: https://sign.swisscom.ch/docs/api
  baseURL: https://sign.swisscom.ch/system
  tags:
  - Digital Signatures
  - eSignature
  - Documents
  - Trust Services
  properties:
  - type: Documentation
    url: https://sign.swisscom.ch/docs/guide/getting-started
  - type: APIReference
    url: https://sign.swisscom.ch/docs/api
  - type: OpenAPI
    url: openapi/swisscom-sign-integration-api-openapi.json
  - type: Authentication
    url: https://sign.swisscom.ch/docs/guide/authentication
- aid: swisscom:swisscom-all-in-signing-service-api
  name: Swisscom All-in Signing Service (AIS) API
  description: >-
    The Swisscom Trust Services All-in Signing Service REST interface for creating
    AdES signatures and seals under eIDAS and ZertES, following the ETSI TS 119 432
    remote signature creation profile. Swisscom Trust Services publishes an OpenAPI 3.0
    description of the ETSI interface, plus WSDL/WADL service descriptions, Postman
    collections and iText/PDFBox client libraries, on its public GitHub organisation;
    the full integration guides remain in the partner area.
  humanURL: https://github.com/SwisscomTrustServices/AIS
  baseURL: https://ais.swisscom.com/AIS-Server/rs/v1.0
  tags:
  - Digital Signatures
  - Seals
  - eIDAS
  - ZertES
  - Trust Services
  properties:
  - type: Documentation
    url: https://trustservices.swisscom.com/en/esignature-hub/downloads-and-documents
  - type: APIReference
    url: https://github.com/SwisscomTrustServices/AIS
  - type: OpenAPI
    url: openapi/swisscom-all-in-signing-service-openapi.yml
  - type: PostmanCollection
    url: https://github.com/SwisscomTrustServices/AIS-Postman-Samples
  - type: GitHubOrganization
    url: https://github.com/SwisscomTrustServices
- aid: swisscom:swisscom-text-messaging-api
  name: Swisscom Text Messaging (SMS) API
  description: >-
    Application-to-person SMS sending over the Swisscom messaging infrastructure with
    onward delivery to 260+ operators globally, including delivery-notification
    callbacks to a customer-supplied callbackUrl. Sold as the Text Messaging (SMS)
    product on the Swisscom Digital Marketplace; by default sending is restricted to
    Switzerland with a configurable monthly cost limit.
  humanURL: https://digital.swisscom.com/products/text-messaging
  baseURL: https://api.swisscom.com/messaging/v1/sms
  tags:
  - Messaging
  - SMS
  - A2P
  - CPaaS
  properties:
  - type: Documentation
    url: https://digital.swisscom.com/products/text-messaging
  - type: APIReference
    url: https://github.com/swisscom-api/doc/wiki
  - type: Dashboard
    url: https://sms.icp.swisscom.com/
- aid: swisscom:swisscom-phone-number-validation-api
  name: Swisscom Phone Number Validation API
  description: >-
    Two-factor authentication API that starts an SMS token validation flow against an
    MSISDN and then verifies the token the user received. This is Swisscom's own
    SMS-OTP product, not the CAMARA Number Verification network API — it verifies
    possession of a handset by delivering a code, it does not perform network-based
    number verification.
  humanURL: https://digital.swisscom.com/products/phone-number-validation
  baseURL: https://api.swisscom.com/messaging/v1/tokenvalidation
  tags:
  - Identity Verification
  - Two-Factor Authentication
  - SMS
  - OTP
  properties:
  - type: Documentation
    url: https://digital.swisscom.com/products/phone-number-validation
  - type: APIReference
    url: https://github.com/swisscom-api/doc/wiki
- aid: swisscom:swisscom-receive-sms-api
  name: Swisscom Receive SMS API
  description: >-
    Inbound SMS API that exposes message inboxes so applications can receive texts from
    customers and build two-way messaging flows, alerting and device control alongside
    the outbound Text Messaging product.
  humanURL: https://digital.swisscom.com/products/receive-sms
  baseURL: https://api.swisscom.com/messaging/sms/inboxes
  tags:
  - Messaging
  - SMS
  - Inbound

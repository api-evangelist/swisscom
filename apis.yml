- aid: swisscom:swisscom-voice-voip-api
  name: Swisscom Voice VoIP API
  description: >-
    Legacy Voice API cluster for controlling a Swisscom VoIP subscriber — placing and
    listing calls, managing call forwardings, simultaneous ringing and phonebooks, and
    subscribing to VoIP events. Secured by OAuth 2.0 with read/write scopes such as
    read-voip-callforwardings and write-voip-callforwardings. Documented only as
    RAML-rendered HTML in a GitHub wiki last touched in 2024; the gateway still answers
    with a 401.
  humanURL: https://github.com/swisscom-api/doc/wiki
  baseURL: https://api.swisscom.com/voice/v1/voip
  tags:
  - Voice
  - VoIP
  - Telephony
  properties:
  - type: Documentation
    url: https://github.com/swisscom-api/doc
  - type: APIReference
    url: https://github.com/swisscom-api/doc/wiki
- aid: swisscom:swisscom-voice-mail-api
  name: Swisscom Voice Mail API
  description: >-
    Legacy Voice API for listing and retrieving recent voicemail messages for a Swisscom
    MSISDN, secured by OAuth 2.0 client-credentials or authorization-code grants.
    Documented as RAML-rendered HTML in the same GitHub wiki.
  humanURL: https://github.com/swisscom-api/doc/wiki
  baseURL: https://api.swisscom.com/voice/v1/voicemail

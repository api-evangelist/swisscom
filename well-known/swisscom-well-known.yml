source: live probes of every apis.yml host and OpenAPI servers[] host
notes: >-
  Swisscom publishes one group-wide RFC 9116 security.txt on www.swisscom.ch. The API
  gateway (api.swisscom.com), the signing platform (sign.swisscom.ch), the AIS host
  (ais.swisscom.com), the marketplace (digital.swisscom.com) and the Trust Services site
  publish no /.well-known/ discovery surface of their own. The only machine-readable
  discovery document on an API host is the Keycloak OIDC configuration for the
  swisscom-public realm that fronts the Swisscom Sign Integration API — it is served from
  the realm path, not from the host root.

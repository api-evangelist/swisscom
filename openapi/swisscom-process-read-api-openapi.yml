openapi: 3.2.0
info:
  title: 'Swisscom Sign Integration Process: read API'
  description: '# Purpose


    The Swisscom Sign *Integration API* enables backend systems to create, configure, release, and monitor digital signing processes end-to-end with minimal manual interaction.'
  termsOfService: https://sign.swisscom.ch/api-docs
  contact:
    name: Support
    url: https://digitaltrust.swisscom.ch/en/
  version: 2.19.0
  x-changelog:
    2.19.0: New `GET /api/process/{processId}/file/{fileId}/content` endpoint returns the raw binary content of a process file instead of a Base64-encoded JSON document. The `Content-Type` reflects the actual file type (`application/pdf` for documents, `application/zip` for verification documents). The response includes a `Content-Disposition` header with the original filename. Authorization and error semantics are identical to the existing file endpoint, which remains unchanged. Release endpoint now accepts optional `signatureMethods` to restrict the allowed signature methods (`APP`, `CLICK`, `OSS`, `PASSKEY`, `SMS`) per process. Methods are validated against the document's signature level. Added the two new signature methods `PASSKEY` (WebAuthn passkey authentication) and `OSS` (One-Shot Signing without prior device registration), both for corporate tenants only. Added Sample 5 (OSS single signer). Enhanced `signatureMethods` documentation with detailed descriptions for each method.
    2.18.0: The `GET /api/process` response now includes a stable `page` object containing `totalElements`, `totalPages`, `size`, and `number`. The root-level fields `totalElements`, `totalPages`, `number`, `size`, `first`, and `last` are deprecated and will be removed in a future version. Please migrate to `page.totalElements`, `page.totalPages`, `page.size`, and `page.number`.
    2.17.0: Release endpoint now allows an optional configuration of automatic reminders in the `notification` node. Reminders can be defined with an `interval` or `beforeExpiry` configuration.
    2.16.0: GwG online identity verification (`signer.verification`) is now restricted to corporate tenants. Submitting a `verification` object on a signer for a non-corporate tenant will be rejected with a `400 Bad Request` validation error.
    2.15.0: 'Attach endpoint now accepts `locator: TAG` on signature positions to resolve placement at runtime by searching for a tag string embedded in the PDF (`\s1\` for index 0, `\s2\` for index 1, etc.). The tag marks the upper-left corner of the signature field. Optional `offsetX` / `offsetY` (PDF points, −200 to 200) allow fine-tuning. Coordinates are not required when using TAG. Default behaviour (omitting `locator` or using COORDINATES) is fully backward-compatible.'
    2.14.0: Added optional `teamId` filter parameter to `GET /api/process` for filtering processes by team. Added optional `validUntilWithin` filter parameter (ISO 8601 duration) to `GET /api/process` for filtering processes whose `validUntil` falls within the given duration.
    2.13.0: 'Added new signer status values: `WAITING` (not yet invited), `DECLINED` (signer declined), `REMOVED` (signer removed), and `REPLACED` (signer replaced with a new signer).'
    2.12.0: Release endpoint now accepts optional `validUntil` to set process expiration. Replaced `language` field with new `notification` object containing `locale` and `suppress` for opt-out control of notification types (`INVITE`, `COMPLETION`, `ALL`). The `language` field is now deprecated.
    2.11.0: New findAll service added for processes with filter (`status`), sorting (`createdDate`), and paging.
    2.10.0: Signer.status has been renamed from `DISCONTINUED` to `CANCELED` for better clarity. New attribute `canceledOn` replaces `discontinuedOn`, which has been set to deprecated.
    2.9.0: Added optional `teamId` on `Process`.
    2.8.0: Added optional `partnerId` to `Process` for enhanced partner management and tracking.
    2.7.0: Added optional `authorization` on `Process` as write-only. Defaults to CODE for backwards-compatability when no authorization value is provided.
    2.6.0: Removed `domicile` on `Verification`.
    2.5.0: Added new field `stickerProvider` to `FileSignaturePosition`. This new field determines how signature stickers are rendered. Currently, two choices are available, the classic `VISUAL_SIGNATURE_PROVIDER` for backwards-compatibility, and a new `CUSTOM_VISUAL_SIGNATURE_PROVIDER`. If `CUSTOM_VISUAL_SIGNATURE_PROVIDER` is selected, users can manually draw a signature, which will be incorporated into the sticker.
    2.4.0: Restricted email length to `254` characters. Restricted `externalIdentifier` characters to strengthen url-encoding conformity.
    2.3.0: Renamed `pairing` and its fields `pairing.userId` and `pairing.app` to `authentication`, `authentication.identity` and `authentication.namespace`.
    2.2.0: '- Added `scope` and `mode` to Setup and Open requests.

      - `Signer.firstName` and `Signer.lastName` are now mandatory.

      - `NonPerson.name` is now mandatory.

      - Added process wide `email` validation on `Participants`.

      - Process creation now returns `Process` scheme.

      - Fixed a bug where the `externalIdentifier` was not accepted in the Open request.

      '
    2.1.0: Added `signer.status`, `signer.signedOn` and `signer.discontinuedOn` to `Signer` schema.
    2.0.0: 'Major refactoring of the REST API. The API is now structured around a single `/processes` endpoint, which allows for more flexible and efficient process management. '
  x-last-updated:
    last-updated: '2026-07-16'
servers:
- url: https://sign.swisscom.ch/system
  description: Productive Server
security:
- SwisscomSignOAuth2: []
tags:
- name: 'Process: read'
  description: Access process information and download signed or original documents once the signing is complete.
paths:
  /api/process:
    get:
      tags:
      - 'Process: read'
      summary: Get all processes (paginated)
      description: 'Returns a paginated list of processes.


        Supports optional filtering by `status`, `teamId`, and `validUntilWithin` (ISO 8601 duration).

        The page size is limited to a maximum of 20 items.

        Sorting is strictly performed on ''createdDate'', but the direction (ASC/DESC) can be defined.'
      operationId: findAll
      parameters:
      - name: status
        in: query
        description: Filter by status.
        required: false
        schema:
          type: string
          description: 'Lifecycle states:

            * `CREATED` – Process object exists; configuration may continue.

            * `PENDING` – Process released; waiting for signatures..

            * `COMPLETED` – All required signatures done.

            * `EXPIRED` – Automatically set when `validUntil` is reached.

            '
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - EXPIRED
          example: PENDING
        example: PENDING
      - name: teamId
        in: query
        description: Filter by team ID.
        required: false
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      - name: validUntilWithin
        in: query
        description: Filter by validUntil within the given ISO 8601 duration (e.g. P30D, PT12H).
        required: false
        schema:
          type: string
        example: P30D
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - createdDate,DESC
          items:
            type: string
      responses:
        '200':
          description: Returns a page of processes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPage'
        '400':
          description: Invalid pagination parameters (e.g. size > 20) or invalid sort direction.
        '401':
          description: Authorization information is missing or invalid.
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read:all
  /api/process/{processId}/open/{personId}:
    post:
      tags:
      - 'Process: read'
      summary: Generate participant access URL
      description: 'Generate an URL for a specific participant that can be used to open the process in the Swisscom Sign UI. Optional return URLs can be used to redirect the user back to the calling third party system. If an unreleased process is opened, an error is returned. For unreleased processes, /process/{processId}/setup can be used.


        Preconditions:

        * The service can only be used if the process has already been released via /processId/{processId}/release.'
      operationId: open
      parameters:
      - name: processId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: personId
        in: path
        description: The system-assigned identifier or the external reference from your system can be used to identify the person.
        required: true
        schema:
          type: string
          description: The system-assigned identifier or the external reference from your system can be used to identify the person.
      requestBody:
        description: 'Defines how the Swisscom Sign UI should behave when the process is opened for a person.

          Typical use cases:

          - Control the language of the UI.

          - Configure redirect URLs (back, success).

          - Skip authorization for trusted environments.

          - Provide pairing information (App-only, temporary).

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessOpenRequest'
            examples:
              (1) Standard invite (suppress authorization):
                description: (1) Standard invite (suppress authorization)
                value:
                  language: en-GB
                  skipAuthorization: true
              (3) Delegated signing (with authorization):
                description: (3) Delegated signing (with authorization)
                value:
                  language: en-GB
                  skipAuthorization: false
        required: true
      responses:
        '200':
          description: You receive an URL specific to the subscriber with a defined validity period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessOpenResponse'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
  /api/process/{processId}:
    get:
      tags:
      - 'Process: read'
      summary: Get process details
      description: 'Returns the full process object including participants, documents, properties,

        and current status.


        Can only be accessed if the process has been initiated and the caller is authorized.'
      operationId: getProcess
      parameters:
      - name: processId
        in: path
        description: Unique identifier of the process.
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      responses:
        '200':
          description: Returns the full document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '401':
          description: Authorization information is missing or invalid.
        '404':
          description: Process not found.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
  /api/process/{processId}/status:
    get:
      tags:
      - 'Process: read'
      summary: Get process status
      description: Returns the current status of the process. Requires that the process exists and the caller is authorized.
      operationId: getStatus
      parameters:
      - name: processId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returns the state of the desired document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStatusResponse'
        '401':
          description: Authorization information is missing or invalid.
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
  /api/process/{processId}/record:
    get:
      tags:
      - 'Process: read'
      summary: Get auditing records
      description: This service can be used only with a valid process. All created auditing records are returned in descending order of creation date. Thus, the first record is the most recent.
      operationId: getRecords
      parameters:
      - name: processId
        in: path
        description: Unique identifier of the process.
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      responses:
        '200':
          description: Returns a list of auditing records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSuccessRecordResponse'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error or the process is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
  /api/process/{processId}/file/{fileId}:
    get:
      tags:
      - 'Process: read'
      summary: Download process file
      description: 'Retrieves a file that belongs to the specified process.


        Possible file types:

        - Attached original documents

        - Signed or partially signed documents (available as soon as at least one signer has signed)

        - Verification documents (if online verification was performed)


        Files are only available until the process has been archived (archivedOn is set).'
      operationId: getFile
      parameters:
      - name: processId
        in: path
        description: System-assigned process identifier (UUID).
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      - name: fileId
        in: path
        description: 'Identifier of the file within the process.


          Can be either:

          - The internal UUID assigned by the system

          - The externalIdentifier provided during upload

          '
        required: true
        schema:
          type: string
        examples:
          Internal UUID:
            description: Internal UUID
            value: d7bde7d1-1234-4abc-8f1a-42c1e3b2c9b5
          External Identifier:
            description: External Identifier
            value: file:offer-2025-001
      responses:
        '200':
          description: Returns a file attached to the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachment'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The document process was archived and the file has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: The file cannot be downloaded yet because the document is not in the appropriate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
  /api/process/{processId}/file/{fileId}/content:
    get:
      tags:
      - 'Process: read'
      summary: Download process file content
      description: 'Retrieves the raw binary content of a file that belongs to the specified process.


        Unlike the parent resource, which returns the file as Base64 within a JSON document,

        this endpoint streams the file content directly as binary data.


        Possible file types:

        - Attached original documents (PDF)

        - Signed or partially signed documents (PDF, available as soon as at least one signer has signed)

        - Verification documents (ZIP, if online verification was performed)


        The Content-Type of the response reflects the actual file type.


        Files are only available until the process has been archived (archivedOn is set).'
      operationId: getFileContent
      parameters:
      - name: processId
        in: path
        description: System-assigned process identifier (UUID).
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      - name: fileId
        in: path
        description: 'Identifier of the file within the process.


          Can be either:

          - The internal UUID assigned by the system

          - The externalIdentifier provided during upload

          '
        required: true
        schema:
          type: string
        examples:
          Internal UUID:
            description: Internal UUID
            value: d7bde7d1-1234-4abc-8f1a-42c1e3b2c9b5
          External Identifier:
            description: External Identifier
            value: file:offer-2025-001
      responses:
        '200':
          description: Returns the raw binary content of the file.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: The document process was archived and the file has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: The file cannot be downloaded yet because the document is not in the appropriate state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:read
components:
  schemas:
    PageMetadata:
      type: object
      description: Stable pagination metadata.
      properties:
        totalElements:
          type: integer
          format: int64
          description: Total number of matching processes across all pages.
        totalPages:
          type: integer
          format: int32
          description: Total number of pages.
        size:
          type: integer
          format: int32
          description: Number of processes per page.
        number:
          type: integer
          format: int32
          description: Zero-based index of the current page.
    CoordinateSignaturePosition:
      allOf:
      - $ref: '#/components/schemas/FileSignaturePositionInput'
      - type: object
        properties:
          signer:
            type: string
            description: Identifier of the signer (UUID or externalIdentifier).
            example: 02c2f3cc-e263-40c9-b458-79c014a153a2
            maxLength: 128
            minLength: 0
          locator:
            type: string
            description: Discriminator. Omit or set to 'COORDINATES'.
            enum:
            - COORDINATES
            - TAG
            example: COORDINATES
          pageNumber:
            type: integer
            format: int32
            description: 'Zero-based page index. Negative values count from the end: -1 = last page.'
            example: -1
          positionX:
            type: integer
            format: int32
            description: X-coordinate in PDF points from the left edge of the page.
            example: 150
            minimum: 0
          positionY:
            type: integer
            format: int32
            description: Y-coordinate in PDF points from the top edge of the page.
            example: 300
            minimum: 0
          stickerProvider:
            type: string
            description: 'Sticker renderer to use. Default: VISUAL_SIGNATURE_PROVIDER.'
            enum:
            - VISUAL_SIGNATURE_PROVIDER
            - CUSTOM_VISUAL_SIGNATURE_PROVIDER
            example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      description: Signature position defined by explicit page and coordinates (PDF points). Default when 'locator' is absent.
      required:
      - pageNumber
      - positionX
      - positionY
      - signer
      title: CoordinateSignaturePosition
    Person:
      allOf:
      - $ref: '#/components/schemas/Participant'
      - type: object
        properties:
          type:
            type: string
            default: PERSON
            description: Discriminator value. Must be 'PERSON'.
            example: PERSON
          identification:
            type: string
            format: uuid
            description: System-assigned identifier of this participant.
            readOnly: true
          externalIdentifier:
            type: string
            description: External reference from your system.
            example: crm-4711
            maxLength: 50
            minLength: 0
            pattern: '[a-zA-Z0-9._~-]+'
          firstName:
            type: string
            description: First name.
            example: John
            maxLength: 64
            minLength: 0
          lastName:
            type: string
            description: Last name.
            example: Doe
            maxLength: 64
            minLength: 0
          email:
            type: string
            format: email
            description: Email address (RFC 5322).
            example: john.doe@example.com
            maxLength: 254
            minLength: 0
          mobile:
            type: string
            description: Mobile number in E.164 format.
            example: '+41791234567'
            maxLength: 16
      description: Human participant who does not sign. The 'type' discriminator must be 'PERSON'.
      required:
      - type
      title: Person
    Error:
      type: object
      description: Error object returned in case of an unsuccessful request.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of this error for log correlation.
          example: b4a7e3c4-1234-4a12-9c3d-5df1f7b2c8f4
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error (UTC, ISO 8601).
          example: '2025-09-24T14:32:07Z'
        name:
          type: string
          description: Logical error name derived from the thrown exception class name (without 'Exception' suffix).
          example: OrganizationNotFound
        message:
          type: string
          description: Human-readable explanation of the error.
          example: The requested organization does not exist.
        path:
          type: string
          description: Path of the request that caused the error.
          example: /api/process
        httpStatus:
          type: integer
          format: int32
          description: HTTP status code of the error.
          example: 409
        clientSubject:
          type: string
          description: Short subject/title of the error for client display.
          example: Organization not found
        clientBody:
          type: string
          description: Detailed description of the error for client display.
          example: The requested organization could not be located. Please verify the ID.
    FileSignaturePosition:
      type: object
      description: Represents the position of a signature in a file attachment.
      properties:
        signer:
          type: string
          description: 'Identifier of the signer. Either:

            - the internal `identification` (UUID as string), e.g. `02c2f3cc-e263-40c9-b458-79c014a153a2`

            - or the `externalIdentifier` from your system (string, up to 128 characters)

            '
          example: 02c2f3cc-e263-40c9-b458-79c014a153a2
          maxLength: 128
          minLength: 0
        pageNumber:
          type: integer
          format: int32
          description: 'Zero-based index of the page. Negative values count backwards. Examples:

            - `0` = first page

            - `1` = second page

            - `2` = third page

            - ...

            - `-2` = second to last page

            - `-1` = last page

            '
          example: -1
        positionX:
          type: integer
          format: int32
          description: X-coordinate (in pixels) of the top-left corner of the signature field.
          example: 150
          minimum: 0
        positionY:
          type: integer
          format: int32
          description: Y-coordinate (in pixels) of the top-left corner of the signature field.
          example: 300
          minimum: 0
        stickerProvider:
          type: string
          description: Specifies which sticker renderer to use for this signature position. Default is VISUAL_SIGNATURE_PROVIDER.
          enum:
          - VISUAL_SIGNATURE_PROVIDER
          - CUSTOM_VISUAL_SIGNATURE_PROVIDER
          example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      required:
      - pageNumber
      - positionX
      - positionY
      - signer
    TagSignaturePosition:
      allOf:
      - $ref: '#/components/schemas/FileSignaturePositionInput'
      - type: object
        properties:
          signer:
            type: string
            description: Identifier of the signer (UUID or externalIdentifier).
            example: 02c2f3cc-e263-40c9-b458-79c014a153a2
            maxLength: 128
            minLength: 0
          locator:
            type: string
            description: Discriminator. Must be 'TAG'.
            enum:
            - COORDINATES
            - TAG
            example: TAG
          offsetX:
            type: integer
            format: int32
            description: 'Optional X offset in PDF points applied to the resolved tag position. Positive = shift right, negative = shift left. Range: -200 to 200.'
            example: 0
            maximum: 200
            minimum: -200
          offsetY:
            type: integer
            format: int32
            description: 'Optional Y offset in PDF points applied to the resolved tag position. Positive = shift down, negative = shift up. Range: -200 to 200.'
            example: 0
            maximum: 200
            minimum: -200
          stickerProvider:
            type: string
            description: 'Sticker renderer to use. Default: VISUAL_SIGNATURE_PROVIDER.'
            enum:
            - VISUAL_SIGNATURE_PROVIDER
            - CUSTOM_VISUAL_SIGNATURE_PROVIDER
            example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      description: Signature position located by searching for a default tag string in the PDF (\s1\ for index 0, \s2\ for index 1, etc.). The tag marks the upper-left corner of the signature field.
      required:
      - signer
      title: TagSignaturePosition
    ProcessOpenRequest:
      type: object
      description: Request to open a signing process for a specific participant.
      properties:
        language:
          type: string
          description: 'Preferred UI language (BCP-47). Allowed: en-GB, de-CH, fr-CH, it-CH.'
          example: en-GB
        lifecycle:
          type: string
          default: TEMPORARY
          description: 'Controls how parameters (e.g., language, URLs, authorization settings)

            are applied when opening the process:

            * `PERMANENT` – Configuration is saved to the process and reused.

            * `TEMPORARY` – Configuration only applies to this request.

            '
          enum:
          - PERMANENT
          - TEMPORARY
          example: TEMPORARY
        skipAuthorization:
          type: boolean
          default: false
          description: 'If `true`, the response URL includes a short-lived one-time code that is redeemed

            immediately when opening the URL (valid for ~15 minutes, single use). This bypasses the

            usual pre-step challenge but **still enforces full authorization** by the system.

            If `false` (default), the user must pass the standard authorization flow after opening the URL.

            '
          example: false
        backUrl:
          type: string
          description: Back URL to the calling application. When set, the UI displays a Home button in the navigation that redirects the user to this URL.
          example: https://customer.example/app/back
          maxLength: 2048
          minLength: 0
        successUrl:
          type: string
          description: Success URL invoked via GET after the signing succeeded. Query parameters (e.g., process and participant identifiers) are appended by the system. The endpoint should respond with an HTTP redirect suitable for browsers.
          example: https://customer.example/app/success?process={processId}&participant={personId}
          maxLength: 2048
          minLength: 0
        authentication:
          $ref: '#/components/schemas/ProcessAuthentication'
          description: Authentication information (temporary App-only feature). Ignored for all other clients.
        scope:
          type: string
          description: 'Scope: defines the scopes that are requested on the token.'
          example: openid sswp:process:create sswp:process:execute sswp:process:manage sswp:process:read sswp:user:read sswp:user:write
          maxLength: 2048
          minLength: 0
        mode:
          type: string
          default: DEFAULT
          description: 'Mode: defines the display mode of the process page.'
          enum:
          - DEFAULT
          - EMBEDDED
          example: DEFAULT
    ProcessStatusResponse:
      type: object
      description: Response object containing the status of a process.
      example:
        id: 4b2b6a3e-9c1d-41b5-87e1-2c7b1f9a7e21
        status: PENDING
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned process identifier.
          example: 4b2b6a3e-9c1d-41b5-87e1-2c7b1f9a7e21
          readOnly: true
        status:
          type: string
          description: Current lifecycle state of the process.
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - EXPIRED
          example: PENDING
          readOnly: true
    Signer:
      type: object
      description: Human participant who signs. The 'type' discriminator must be 'SIGNER'.
      properties:
        type:
          type: string
          default: SIGNER
          description: Discriminator value. Must be 'SIGNER'.
          example: SIGNER
        identification:
          type: string
          format: uuid
          description: System-assigned identifier of this signer.
          readOnly: true
        externalIdentifier:
          type: string
          description: External reference from your system.
          example: crm-4711
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        firstName:
          type: string
          description: First name.
          example: John
          maxLength: 64
          minLength: 0
        lastName:
          type: string
          description: Last name.
          example: Doe
          maxLength: 64
          minLength: 0
        email:
          type: string
          format: email
          description: Email address (RFC 5322).
          example: john.doe@example.com
          maxLength: 254
          minLength: 0
        mobile:
          type: string
          description: 'Mobile number in E.164 format (no spaces or dashes).

            - Authorization behavior: If a mobile number is provided, the fallback code authorization uses an SMS code.

            - Signing behavior: If the number is a Swiss mobile (+41…), it will be preselected for ADVANCED signatures and cannot be changed in the UI.

            '
          example: '+41791234567'
          maxLength: 16
        role:
          type: string
          description: Role or function of the signer.
          example: Chief Signing Officer (CSO)
          maxLength: 256
          minLength: 0
        verification:
          $ref: '#/components/schemas/Verification'
          description: 'Optional online identity verification requirement (GwG).

            If provided when creating the process, the signer must complete an online identification step before signing.

            Verification results (payload/files/timestamps) are generated by the system and are read-only.


            Only available for corporate tenants. Providing this attribute on a non-corporate tenant will cause the create

            request to be rejected with a validation error.

            '
        status:
          type: string
          description: Current signer status.
          enum:
          - WAITING
          - PENDING
          - SIGNED
          - CANCELED
          - DECLINED
          - REMOVED
          - REPLACED
          example: PENDING
          readOnly: true
        signedOn:
          type: string
          format: date-time
          description: Timestamp when the signer completed signing (UTC). Only present if status is SIGNED.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        discontinuedOn:
          type: string
          format: date-time
          deprecated: true
          description: 'Timestamp when the signer has been discontinued (UTC). Only present if status is `CANCELED`. Deprecated: use `canceledOn` instead.'
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        canceledOn:
          type: string
          format: date-time
          description: Timestamp when the signer has been canceled (UTC). Only present if status is `CANCELED`.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        certificateName:
          type: string
          description: Full name extracted from the signing certificate. This field is populated only after the signer has successfully signed the process.It is absent if the signer has not signed yet or if the signing was performed without authentication or using mobile OTP authentication.
          readOnly: true
        certificateMatch:
          type: string
          description: Outcome of the comparison between the signer's declared full name and the name contained in the signing certificate. This field is populated only after the signer has successfully signed the process. If the signing was performed without authentication or using mobile OTP authentication, the value is set to `UNCHECKED`. Otherwise, the result is either `MATCH` or `MISMATCH`, depending on the comparison outcome.
          enum:
          - UNCHECKED
          - MATCH
          - MISMATCH
          example: MATCH
          readOnly: true
      required:
      - firstName
      - lastName
      - type
      title: Signer
    Invitees:
      type: object
      description: 'Invitees represent the **additional** signers to be invited for this process.

        The process `initiator` may optionally sign as well; if the initiator is a signer,

        they are **not** listed here again.

        '
      properties:
        personalMessage:
          type: string
          description: 'Personal message included in invitation emails.

            Plain text only: HTML tags are stripped. Use \n for line breaks.

            '
          example: Hello,\nplease review and sign the documents. Thank you!
          maxLength: 8192
          minLength: 0
        signers:
          type: array
          description: Additional signers to invite (excluding the initiator if the initiator also signs).
          items:
            $ref: '#/components/schemas/Signer'
            description: Additional signers to invite (excluding the initiator if the initiator also signs).
    ProcessAuthentication:
      type: object
      description: 'INTERNAL ONLY: Authentication for the first-party namespace. Requests from other clients are ignored.'
      properties:
        identity:
          type: string
          format: uuid
          description: Caller-side user identifier (UUID).
          example: 69924099-a57a-44f8-8cf3-9324f4c93a92
        namespace:
          type: string
          description: Logical namespace of the first-party application (restricted).
          enum:
          - MSA
          - MSAINT
          example: MSAINT
      required:
      - identity
      - namespace
    Process:
      type: object
      description: 'A process represents an end-to-end signing flow with 1..n signers over 1..n documents.

        The initiator can optionally sign; additional signers are listed in `invitees`.

        '
      example:
        signatureLevel: QUALIFIED
        initiator:
          type: NON_PERSON
          externalIdentifier: ext-systems_oms-42
          name: Swisscom Sign Orchestrator
        invitees:
          personalMessage: Hello, please sign. Thank you!
          signers:
          - type: SIGNER
            firstName: John
            lastName: Doe
            email: john.doe@example.com
            status: PENDING
        properties:
        - key: contractType
          value: NDA
        - key: department
          value: Legal
        payload: '{ "caseId": "ABC-42", "priority": "HIGH" }'
        validUntil: '2025-12-31T23:59:59Z'
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned process identifier.
          readOnly: true
        status:
          type: string
          description: Current lifecycle state of the process.
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - EXPIRED
          example: PENDING
          readOnly: true
        signatureLevel:
          type: string
          default: QUALIFIED
          description: Legal quality of the signature(s).
          enum:
          - SIMPLE
          - ADVANCED
          - ADVANCED_EU
          - QUALIFIED
          - QUALIFIED_EU
          example: QUALIFIED
        initiator:
          description: 'Identifies the process initiator.

            One of:

            * NonPerson – technical/app initiator (no signature).

            * Person – human initiator (no signature). Either the email address or the first and last name must be specified.

            * Signer – initiator is also a signer.

            '
          oneOf:
          - $ref: '#/components/schemas/NonPerson'
          - $ref: '#/components/schemas/Person'
          - $ref: '#/components/schemas/Signer'
        invitees:
          $ref: '#/components/schemas/Invitees'
          description: Additional signers to invite (initiator not repeated here).
        teamId:
          type: string
          format: uuid
          description: Optional identifier of an existing team to which the process will be assigned. The team must be created in the cockpit beforehand and the teamId can be retrieved there. If provided, the process will be visible to all members of the specified team. The team assignment cannot be modified after the process is created.
        properties:
          type: array
          description: Optional custom metadata as key/value pairs attached to the process. Keys must be unique. Maximum of 8 entries.
          items:
            $ref: '#/components/schemas/Property'
            description: Optional custom metadata as key/value pairs attached to the process. Keys must be unique. Maximum of 8 entries.
          maxItems: 8
          minItems: 0
        payload:
          type: string
          description: Optional opaque application payload for correlation/auditing. May contain a JSON string.
          example:
            caseId: ABC-42
            priority: HIGH
          maxLength: 8192
          minLength: 0
        validUntil:
          type: string
          format: date-time
          description: 'Expiration timestamp of the process. After this point in time,

            the system automatically transitions the process status to `EXPIRED`.

            '
          example: '2025-12-31T23:59:59Z'
          readOnly: true
        createdDate:
          type: string
          format: date-time
          description: Creation timestamp (UTC).
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          description: Last modification timestamp (UTC).
          readOnly: true
        archiveOn:
          type: string
          format: date-time
          description: Scheduled archival time, if any (UTC).
          readOnly: true
        archivedOn:
          type: string
          format: date-time
          description: Actual time when archival happened, if archived (UTC).
          readOnly: true
        fileReferences:
          type: array
          description: Uploaded files incl. visual signature positions (read-only).
          items:
            $ref: '#/components/schemas/FileReference'
            description: Uploaded files incl. visual signature positions (read-only).
          readOnly: true
        partnerId:
          type: string
          description: Optional partner identifier. If provided, it must reference an existing partner.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        authorization:
          type: string
          default: CODE
          description: 'Authorization requirements for accessing the process.

            '
          enum:
          - CODE
          - ACCOUNT
          example: CODE
          writeOnly: true
      required:
      - initiator
    FileReference:
      type: object
      description: Reference to an uploaded file with its versions and signature positions.
      properties:
        externalIdentifier:
          type: string
          description: External reference identifier provided by the client system for correlation.
          example: contract-2025-Q1
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        initialFileId:
          type: string
          format: uuid
          description: System-generated UUID of the initial file uploaded to the process.
          example: 11111111-2222-3333-4444-555555555555
        lastSignedFileId:
          type: string
          format: uuid
          description: System-generated UUID of the last signed file (after the most recent signature).
          example: 66666666-7777-8888-9999-aaaaaaaaaaaa
        signaturePositions:
          type: array
          description: List of positions where signatures are placed in the file.
          example:
          - signer: 02c2f3cc-e263-40c9-b458-79c014a153a2
            pageNumber: -1
            positionX: 150
            positionY: 300
          items:
            $ref: '#/components/schemas/FileSignaturePosition'
    AuditSuccessRecordResponse:
      type: object
      description: Response containing a list of auditing records for a process
      properties:
        records:
          type: array
          description: Audit records ordered by creation date descending.
          items:
            $ref: '#/components/schemas/AuditRecord'
    AuditRecord:
      type: object
      description: A single audit trail entry describing an action that occurred at a specific time.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of this audit record.
          example: d8b1c0a1-2b9d-4e77-8f7e-1a2b3c4d5e6f
        createdDate:
          type: string
          format: date-time
          description: Timestamp when the record was created (UTC).
          example: '2025-01-22T13:45:12Z'
        action:
          type: string
          description: 'Action label describing what happened. Common values include:

            * `sign` – A signature was performed.

            * `email` – An email was sent.

            * `payment` – A payment was successfully processed.

            * `identification` – A verification or onboarding step was completed.

            * `transaction` – The process completed (fully signed or discontinued).

            '
          example: sign
        status:
          type: string
          description: Result of the action.
          enum:
          - INITIALIZE
          - ABORT
          - FAIL
          - SUCCESS
          - UNKNOWN
          example: SUCCESS
        extras:
          type: object
          additionalProperties:
            type: string
          description: 'Additional action-specific data as key/value pairs.

            Values may be primitives or small JSON objects depending on the action.

            Example keys:

            * `extras.sign_signatureLevel` : "QUALIFIED"

            * `extras.email_type` : "INVITE"

            '
    Participant:
      description: Polymorphic participant. The 'type' discriminator selects the concrete shape.
      discriminator:
        propertyName: type
        mapping:
          NON_PERSON: '#/components/schemas/NonPerson'
          PERSON: '#/components/schemas/Person'
          SIGNER: '#/components/schemas/Signer'
      properties:
        type:
          type: string
      required:
      - type
    ProcessPage:
      type: object
      description: Paginated list of processes.
      properties:
        content:
          type: array
          description: List of processes on the current page.
          items:
            $ref: '#/components/schemas/Process'
        page:
          $ref: '#/components/schemas/PageMetadata'
          description: Pagination metadata.
        totalElements:
          type: integer
          format: int64
          deprecated: true
          description: 'Deprecated: use page.totalElements instead.'
        totalPages:
          type: integer
          format: int32
          deprecated: true
          description: 'Deprecated: use page.totalPages instead.'
        number:
          type: integer
          format: int32
          deprecated: true
          description: 'Deprecated: use page.number instead.'
        size:
          type: integer
          format: int32
          deprecated: true
          description: 'Deprecated: use page.size instead.'
        first:
          type: boolean
          deprecated: true
          description: 'Deprecated: use page.number == 0 instead.'
        last:
          type: boolean
          deprecated: true
          description: 'Deprecated: use page.number == page.totalPages - 1 instead.'
    ProcessOpenResponse:
      type: object
      description: Response with the deep link to open the process in Swisscom Sign UI.
      properties:
        id:
          type: string
          format: uuid
          description: Process identifier.
          example: 21c2f3cc-e263-40c9-b458-79c014a153a1
          readOnly: true
        url:
          type: string
          format: uri
          description: Participant-specific URL to open the process.
          example: https://test.sign.swisscom.ch/cockpit/process/21c2f3cc-e263-40c9-b458-79c014a153a1/person/02c2f3cc-e263-40c9-b458-79c014a153a2
          readOnly: true
    NonPerson:
      allOf:
      - $ref: '#/components/schemas/Participant'
      - type: object
        properties:
          type:
            type: string
            default: NON_PERSON
            description: Discriminator value. Must be 'NON_PERSON'.
            example: NON_PERSON
          identification:
            type: string
            format: uuid
            description: System-assigned identifier of this participant.
            readOnly: true
          externalIdentifier:
            type: string
            description: External reference from your system for correlation.
            example: ext-crm
            maxLength: 50
            minLength: 0
            pattern: '[a-zA-Z0-9._~-]+'
          name:
            type: string
            description: Display name of the technical system.
            example: Swisscom Sign Orchestrator
            maxLength: 50
            minLength: 0
      description: Technical participant (non-human). The 'type' discriminator must be 'NON_PERSON'.
      required:
      - name
      - type
      title: NonPerson
    Property:
      type: object
      description: 'A single property (key/value) that can be attached to the process.

        Keys must be unique within the process.

        '
      example:
        key: contractType
        value: NDA
      properties:
        key:
          type: string
          description: Unique property key (case-sensitive).
          example: contractType
          maxLength: 64
          minLength: 0
        value:
          type: string
          description: Property value.
          example: NDA
          maxLength: 64
          minLength: 0
      required:
      - key
      - value
    Verification:
      type: object
      description: "Online identity verification (GwG) for a signer.\n\nOnly available for clients of type `Corporate`. Providing this object in non-corporate context will cause\nthe create request to be rejected with a validation error.\n\nUsage (input):\n- To enforce GwG identification, include this object in the signer when creating the process.\n  Presence of this object (even as an empty object) enables the online identification requirement.\n- `residentPermit` configures the verification flow. If omitted, the system defaults to `true`.\n\nOutcome (read-only):\n- Pending: both `verifiedOn` and `rejectedOn` are null.\n- Approved: `verifiedOn` is set and result artifacts may be available.\n- Rejected: `rejectedOn` is set. In this case, typically only `payload` is present.\n\nResult artifacts (read-only):\n- `payload` contains the provider result as a JSON string (system integrators only).\n- `files` may contain references to a PDF report and a ZIP bundle provided by the verification provider.\n  Files can be downloaded via `GET /api/process/{processId}/file/{fileId}`.\n  The PDF is additionally attached to the process as a document and must be signed together with the other documents.\n"
      properties:
        processId:
          type: string
          description: Verification process identifier at the provider (read-only).
          example: 43c2f3cc-e263-40c9-b458-79c014a153a1
          maxLength: 36
          minLength: 0
          readOnly: true
        verifiedOn:
          type: string
          format: date-time
          description: Timestamp when verification was approved (UTC, read-only). Mutually exclusive with `rejectedOn`.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        rejectedOn:
          type: string
          format: date-time
          description: Timestamp when verification was rejected (UTC, read-only). Mutually exclusive with `verifiedOn`.
          example: '2025-09-24T15:10:22Z'
          readOnly: true
        payload:
          type: string
          description: 'Provider result payload as JSON string (read-only).

            Present for approved or rejected verifications. Intended for system integrators.

            '
          example:
            result: APPROVED
            score: 0.98
          maxLength: 20000
          minLength: 0
          readOnly: true
        files:
          type: array
          description: 'File references created by the verification provider (read-only), e.g. PDF report and/or ZIP bundle.

            Download via `GET /api/process/{processId}/file/{fileId}`.

            '
          items:
            type: string
            format: uuid
            description: File identifier (UUID) provided by the verification provider.
            example: 4ac2f3cc-e263-40c9-b458-79c014a153a1
            readOnly: true
          readOnly: true
        residentPermit:
          type: boolean
          default: true
          description: 'Whether a Swiss residence permit is required for the signer.


            Input parameter used to configure the online identification flow.

            If omitted, the system defaults to `true`.

            '
          example: true
      title: Verification
    FileSignaturePositionInput:
      description: "Polymorphic signature position for the attach request (write-only).\n\nThe 'locator' field selects the concrete shape:\n  - COORDINATES (default): place the signature at an explicit page and coordinate.\n  - TAG: resolve the position at runtime by searching for a tag string in the PDF\n    (e.g. \\s1\\ for the first signer).\n\nWhen 'locator' is omitted the request is treated as COORDINATES.\n"
      discriminator:
        propertyName: locator
        mapping:
          COORDINATES: '#/components/schemas/CoordinateSignaturePosition'
          TAG: '#/components/schemas/TagSignaturePosition'
      properties:
        locator:
          type: string
      required:
      - locator
    FileAttachment:
      type: object
      description: Represents the configuration for attaching a PDF to a Process
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned file identifier.
          example: c9e8d8ed-8a0a-4f5b-8f18-2c95c8fa8d1e
          readOnly: true
        name:
          type: string
          description: Original filename of the PDF.
          example: contract.pdf
          maxLength: 255
          minLength: 0
        content:
          type: string
          format: byte
          description: 'Content of the PDF as Base64 (OpenAPI format: byte). Max 40 MiB raw.'
          example: 
          maxLength: 55924053
          minLength: 0
        contentType:
          type: string
          description: MIME type of the uploaded file. Must be 'application/pdf'.
          example: application/pdf
          maxLength: 50
          minLength: 0
          pattern: ^application/pdf$
        externalIdentifier:
          type: string
          description: Optional client-defined identifier to reference this file.
          example: contract-2025-Q1
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        signaturePositions:
          type: array
          description: Optional signature positions for this PDF (write-only). Each entry is either a CoordinateSignaturePosition or a TagSignaturePosition. Omitting 'locator' defaults to COORDINATES.
          items:
            oneOf:
            - $ref: '#/components/schemas/CoordinateSignaturePosition'
            - $ref: '#/components/schemas/TagSignaturePosition'
          writeOnly: true
      required:
      - content
      - contentType
      - name
  securitySchemes:
    SwisscomSignOAuth2:
      type: oauth2
      description: OAuth 2.0 Client Credentials flow for accessing the Swisscom Sign Integration API.
      flows:
        clientCredentials:
          tokenUrl: https://sign.swisscom.ch/realms/swisscom-public/protocol/openid-connect/token
          scopes:
            sswp:process:create: Create, configure, and submit a new signature process including documents, invitees, and signature options.
            sswp:process:read: Read process metadata or download associated documents.
            sswp:process:read:all: Read metadata of all processes within the organization, with optional filtering.
      x-token-url: https://sign.swisscom.ch/realms/swisscom-public/protocol/openid-connect/token
      x-issuer: https://sign.swisscom.ch/realms/swisscom-public
      x-jwks-uri: https://sign.swisscom.ch/realms/swisscom-public/protocol/openid-connect/certs
      x-claims:
      - organization_id
      x-scopes:
        sswp:process:create: Create, configure, and submit a new signature process.
        sswp:process:read:all: Read metadata of all processes within the organization, with optional filtering.
        sswp:process:read: Read process metadata or download associated documents.
      x-audience: swisscom-sign-api
externalDocs:
  description: Service description
  url: https://www.swisscom.ch/sign

openapi: 3.2.0
info:
  title: 'Swisscom Sign Integration Process: create API'
  description: '# Purpose


    The Swisscom Sign *Integration API* enables backend systems to create, configure, release, and monitor digital signing processes end-to-end with minimal manual interaction.'
  termsOfService: https://sign.swisscom.ch/api-docs
  contact:
    name: Support
    url: https://digitaltrust.swisscom.ch/en/
  version: 2.19.0
  x-changelog:
    2.19.0: New `GET /api/process/{processId}/file/{fileId}/content` endpoint returns the raw binary content of a process file instead of a Base64-encoded JSON document. The `Content-Type` reflects the actual file type (`application/pdf` for documents, `application/zip` for verification documents). The response includes a `Content-Disposition` header with the original filename. Authorization and error semantics are identical to the existing file endpoint, which remains unchanged. Release endpoint now accepts optional `signatureMethods` to restrict the allowed signature methods (`APP`, `CLICK`, `OSS`, `PASSKEY`, `SMS`) per process. Methods are validated against the document's signature level. Added the two new signature methods `PASSKEY` (WebAuthn passkey authentication) and `OSS` (One-Shot Signing without prior device registration), both for corporate tenants only. Added Sample 5 (OSS single signer). Enhanced `signatureMethods` documentation with detailed descriptions for each method.
    2.18.0: The `GET /api/process` response now includes a stable `page` object containing `totalElements`, `totalPages`, `size`, and `number`. The root-level fields `totalElements`, `totalPages`, `number`, `size`, `first`, and `last` are deprecated and will be removed in a future version. Please migrate to `page.totalElements`, `page.totalPages`, `page.size`, and `page.number`.
    2.17.0: Release endpoint now allows an optional configuration of automatic reminders in the `notification` node. Reminders can be defined with an `interval` or `beforeExpiry` configuration.
    2.16.0: GwG online identity verification (`signer.verification`) is now restricted to corporate tenants. Submitting a `verification` object on a signer for a non-corporate tenant will be rejected with a `400 Bad Request` validation error.
    2.15.0: 'Attach endpoint now accepts `locator: TAG` on signature positions to resolve placement at runtime by searching for a tag string embedded in the PDF (`\s1\` for index 0, `\s2\` for index 1, etc.). The tag marks the upper-left corner of the signature field. Optional `offsetX` / `offsetY` (PDF points, −200 to 200) allow fine-tuning. Coordinates are not required when using TAG. Default behaviour (omitting `locator` or using COORDINATES) is fully backward-compatible.'
    2.14.0: Added optional `teamId` filter parameter to `GET /api/process` for filtering processes by team. Added optional `validUntilWithin` filter parameter (ISO 8601 duration) to `GET /api/process` for filtering processes whose `validUntil` falls within the given duration.
    2.13.0: 'Added new signer status values: `WAITING` (not yet invited), `DECLINED` (signer declined), `REMOVED` (signer removed), and `REPLACED` (signer replaced with a new signer).'
    2.12.0: Release endpoint now accepts optional `validUntil` to set process expiration. Replaced `language` field with new `notification` object containing `locale` and `suppress` for opt-out control of notification types (`INVITE`, `COMPLETION`, `ALL`). The `language` field is now deprecated.
    2.11.0: New findAll service added for processes with filter (`status`), sorting (`createdDate`), and paging.
    2.10.0: Signer.status has been renamed from `DISCONTINUED` to `CANCELED` for better clarity. New attribute `canceledOn` replaces `discontinuedOn`, which has been set to deprecated.
    2.9.0: Added optional `teamId` on `Process`.
    2.8.0: Added optional `partnerId` to `Process` for enhanced partner management and tracking.
    2.7.0: Added optional `authorization` on `Process` as write-only. Defaults to CODE for backwards-compatability when no authorization value is provided.
    2.6.0: Removed `domicile` on `Verification`.
    2.5.0: Added new field `stickerProvider` to `FileSignaturePosition`. This new field determines how signature stickers are rendered. Currently, two choices are available, the classic `VISUAL_SIGNATURE_PROVIDER` for backwards-compatibility, and a new `CUSTOM_VISUAL_SIGNATURE_PROVIDER`. If `CUSTOM_VISUAL_SIGNATURE_PROVIDER` is selected, users can manually draw a signature, which will be incorporated into the sticker.
    2.4.0: Restricted email length to `254` characters. Restricted `externalIdentifier` characters to strengthen url-encoding conformity.
    2.3.0: Renamed `pairing` and its fields `pairing.userId` and `pairing.app` to `authentication`, `authentication.identity` and `authentication.namespace`.
    2.2.0: '- Added `scope` and `mode` to Setup and Open requests.

      - `Signer.firstName` and `Signer.lastName` are now mandatory.

      - `NonPerson.name` is now mandatory.

      - Added process wide `email` validation on `Participants`.

      - Process creation now returns `Process` scheme.

      - Fixed a bug where the `externalIdentifier` was not accepted in the Open request.

      '
    2.1.0: Added `signer.status`, `signer.signedOn` and `signer.discontinuedOn` to `Signer` schema.
    2.0.0: 'Major refactoring of the REST API. The API is now structured around a single `/processes` endpoint, which allows for more flexible and efficient process management. '
  x-last-updated:
    last-updated: '2026-07-16'
servers:
- url: https://sign.swisscom.ch/system
  description: Productive Server
security:
- SwisscomSignOAuth2: []
tags:
- name: 'Process: create'
  description: Allows you to set up your process according to your needs, including adding documents, configuring invitees, setting signature options, and submitting the process for execution.
paths:
  /api/process:
    post:
      tags:
      - 'Process: create'
      summary: Create a process
      description: 'Creates a new signing process.

        - Non-interactive (API release): Provide all required data (documents, signers, options) up front.

        - Setup (handover to Swisscom Sign UI): You can submit a minimal process and adjust metadata later in the UI.'
      operationId: create
      requestBody:
        description: Minimal payload for creating a signing process.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Process'
            examples:
              (1) Standard invite:
                description: (1) Standard invite
                value:
                  signatureLevel: SIMPLE
                  initiator:
                    type: NON_PERSON
                    externalIdentifier: ext-systems_oms-42
                    name: Swisscom Sign Orchestrator
                  invitees:
                    signers:
                    - type: SIGNER
                      externalIdentifier: crm-4711
                      firstName: John
                      lastName: Doe
                      email: john.doe@example.com
              (2) Invite with GwG identification (Corporate only):
                description: (2) Invite with GwG identification (Corporate only)
                value:
                  signatureLevel: QUALIFIED
                  initiator:
                    type: NON_PERSON
                    externalIdentifier: ext-systems_oms-42
                    name: Swisscom Sign Orchestrator
                  invitees:
                    signers:
                    - type: SIGNER
                      externalIdentifier: crm-4711
                      firstName: John
                      lastName: Doe
                      email: john.doe@example.com
                      verification:
                        residentPermit: true
              (3) Delegated signing:
                description: (3) Delegated signing
                value:
                  signatureLevel: SIMPLE
                  initiator:
                    type: SIGNER
                    externalIdentifier: crm-4711
                    firstName: John
                    lastName: Doe
                    email: john.doe@example.com
              (4) Draft with UI setup:
                description: (4) Draft with UI setup
                value:
                  signatureLevel: SIMPLE
                  initiator:
                    type: PERSON
                    externalIdentifier: crm-4711
        required: true
      responses:
        '201':
          description: The process was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:create
  /api/process/{processId}/setup:
    post:
      tags:
      - 'Process: create'
      summary: Finalize process in Swisscom Sign UI
      description: 'Launches the Swisscom Sign web interface for the initiator to complete the process setup.

        This includes defining visual elements and participant data.


        Once setup is complete, the process is automatically released and notifications are handled by Swisscom Sign.


        **Preconditions:**

        - A process was created via `/process`.

        - The process has not yet been released.'
      operationId: setup
      parameters:
      - name: processId
        in: path
        description: Unique identifier of the process to finalize via UI.
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      requestBody:
        description: 'Defines how the Swisscom Sign UI should behave when the process is opened for setup.

          Typical use cases:

          - Control the language of the UI.

          - Configure redirect URLs (back, success).

          - Provide pairing information (App-only, temporary).

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessSetupRequest'
            examples:
              (4) Draft with UI setup:
                description: (4) Draft with UI setup
                value:
                  language: en-GB
        required: true
      responses:
        '202':
          description: The setup request has been accepted. Please redirect to the provided URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessSetupResponse'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:create
  /api/process/{processId}/release:
    post:
      tags:
      - 'Process: create'
      summary: Release process and notify participants
      description: 'Releases a previously created and fully configured process. Personal access URLs are returned for each participant.

        These can be used for asynchronous execution, typically via email.


        Optionally, you may include email parameters to notify participants directly.

        Optionally, you may configure automatic reminder emails for pending participants.

        Optionally, you may restrict the allowed signature methods (`APP`, `CLICK`, `OSS`, `PASSKEY`, `SMS`) via `signatureMethods`.

        If omitted, the tenant defaults apply. Methods are validated against the document''s signature level.


        Preconditions:

        - A process was created via `/process` with at least one participant.

        - At least one document was attached using `/process/{processId}/attach`.

        - Every signer must be placed on at least one document.

        - At least one document must have all signers placed on it.

        - All visual signatures are placed within the visible area.'
      operationId: release
      parameters:
      - name: processId
        in: path
        description: Unique identifier of the process to be released.
        required: true
        schema:
          type: string
          format: uuid
        example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      requestBody:
        description: 'Optional notification and reminder configuration for participants.


          **Notification behavior:**

          - No body or empty body → no notifications sent

          - `notification.locale` set → all participants notified in that language

          - `notification.suppress` set → opt-out specific notification types


          **Automatic reminders (`notification.reminder`):**

          - `reminder.interval` → recurring reminder every X days while the process is pending (e.g. `P3D`)

          - `reminder.beforeExpiry` → one reminder per entry, sent X days before `validUntil` (e.g. `["P7D", "P2D"]`)

          - Both fields are optional and independent; omit `reminder` entirely to disable automatic reminders

          - Requires `notification.locale` — reminders cannot be sent without a notification locale

          - Incompatible with `notification.suppress: ["ALL"]` → returns 409


          **Deprecated:** The `language` field is deprecated. Use `notification.locale` instead.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessReleaseRequest'
            examples:
              (1a) Standard invite (emails in German):
                description: (1a) Standard invite (emails in German)
                value:
                  notification:
                    locale: de-CH
              (1b) Standard invite (no emails):
                description: (1b) Standard invite (no emails)
                value:
                  notification:
                    locale: de-CH
                    suppress:
                    - ALL
              (2) Invite with GwG identification (emails in German):
                description: (2) Invite with GwG identification (emails in German)
                value:
                  notification:
                    locale: de-CH
              (3) Delegated signing (emails in German):
                description: (3) Delegated signing (emails in German)
                value:
                  notification:
                    locale: de-CH
              (4a) Invite with automatic reminders (before expiry):
                description: Sends a reminder 7 days and again 2 days before the process expires.
                value:
                  validUntil: '2026-12-31T23:59:59+01:00'
                  notification:
                    locale: de-CH
                    reminder:
                      beforeExpiry:
                      - P7D
                      - P2D
              (4b) Invite with automatic reminders (recurring interval):
                description: Sends a recurring reminder every 3 days while the process is pending.
                value:
                  validUntil: '2026-12-31T23:59:59+01:00'
                  notification:
                    locale: de-CH
                    reminder:
                      interval: P3D
              (4c) Invite with automatic reminders (combined):
                description: Recurring reminder every 3 days, plus dedicated reminders 7 and 2 days before expiry.
                value:
                  validUntil: '2026-12-31T23:59:59+01:00'
                  notification:
                    locale: de-CH
                    reminder:
                      interval: P3D
                      beforeExpiry:
                      - P7D
                      - P2D
              (5) One-shot signing (OSS):
                description: Restricts the signature method to OSS so the signer authenticates on-the-fly without prior device registration. All other steps are identical to Sample 1.
                value:
                  notification:
                    locale: de-CH
                  signatureMethods:
                  - OSS
      responses:
        '200':
          description: Process released; participant URLs returned (permanently valid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '208':
          description: Process was already released; participant URLs returned (permanently valid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '401':
          description: Authorization information is missing or invalid.
        '403':
          description: Forbidden – caller not allowed to release this process.
        '404':
          description: Process not found.
        '409':
          description: Conflict – e.g. reminders configured but all notifications are suppressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:create
  /api/process/{processId}/attach:
    post:
      tags:
      - 'Process: create'
      summary: Attach documents to process
      description: 'Attaches one or more PDF files to the specified process. You may repeat this call up to a maximum of 100 files.

        Only `application/pdf` is supported, and each file must not exceed 40MB in size.


        **Preconditions:**

        - The process status must be `CREATED`.'
      operationId: attach
      parameters:
      - name: processId
        in: path
        description: ID of the process to which the PDF will be attached.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: PDF file and optional signature positions.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileAttachment'
            examples:
              (1a) Standard invite (coordinates):
                description: (1a) Standard invite (coordinates)
                value:
                  name: Offer.pdf
                  externalIdentifier: file_offer-2025-001
                  signaturePositions:
                  - signer: crm-4711
                    locator: COORDINATES
                    pageNumber: 0
                    positionX: 120
                    positionY: 700
                  contentType: application/pdf
                  content: 
              (1b) Standard invite (tag):
                description: (1b) Standard invite (tag)
                value:
                  name: Offer.pdf
                  externalIdentifier: file_offer-2025-001
                  signaturePositions:
                  - signer: crm-4711
                    locator: TAG
                    offsetX: 0
                    offsetY: 0
                  contentType: application/pdf
                  content: 
              (2) Invite with GwG identification:
                description: (2) Invite with GwG identification
                value:
                  name: Offer.pdf
                  externalIdentifier: file_offer-2025-001
                  signaturePositions:
                  - signer: crm-4711
                    pageNumber: 0
                    positionX: 120
                    positionY: 700
                  contentType: application/pdf
                  content: 
              (3) Delegated signing:
                description: (3) Delegated signing
                value:
                  name: Offer.pdf
                  externalIdentifier: file_offer-2025-001
                  signaturePositions:
                  - signer: crm-4711
                    pageNumber: 0
                    positionX: 120
                    positionY: 700
                  contentType: application/pdf
                  content: 
              (4) Draft with UI setup:
                description: (4) Draft with UI setup
                value:
                  name: Offer.pdf
                  externalIdentifier: file_offer-2025-001
                  signaturePositions:
                  - signer: crm-4711
                    pageNumber: 0
                    positionX: 120
                    positionY: 700
                  contentType: application/pdf
                  content: 
        required: true
      responses:
        '201':
          description: The file has been attached successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachResponse'
        '401':
          description: Authorization information is missing or invalid.
        '409':
          description: Occurs when there is a general error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SwisscomSignOAuth2:
        - sswp:process:create
components:
  schemas:
    CoordinateSignaturePosition:
      allOf:
      - $ref: '#/components/schemas/FileSignaturePositionInput'
      - type: object
        properties:
          signer:
            type: string
            description: Identifier of the signer (UUID or externalIdentifier).
            example: 02c2f3cc-e263-40c9-b458-79c014a153a2
            maxLength: 128
            minLength: 0
          locator:
            type: string
            description: Discriminator. Omit or set to 'COORDINATES'.
            enum:
            - COORDINATES
            - TAG
            example: COORDINATES
          pageNumber:
            type: integer
            format: int32
            description: 'Zero-based page index. Negative values count from the end: -1 = last page.'
            example: -1
          positionX:
            type: integer
            format: int32
            description: X-coordinate in PDF points from the left edge of the page.
            example: 150
            minimum: 0
          positionY:
            type: integer
            format: int32
            description: Y-coordinate in PDF points from the top edge of the page.
            example: 300
            minimum: 0
          stickerProvider:
            type: string
            description: 'Sticker renderer to use. Default: VISUAL_SIGNATURE_PROVIDER.'
            enum:
            - VISUAL_SIGNATURE_PROVIDER
            - CUSTOM_VISUAL_SIGNATURE_PROVIDER
            example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      description: Signature position defined by explicit page and coordinates (PDF points). Default when 'locator' is absent.
      required:
      - pageNumber
      - positionX
      - positionY
      - signer
      title: CoordinateSignaturePosition
    Person:
      allOf:
      - $ref: '#/components/schemas/Participant'
      - type: object
        properties:
          type:
            type: string
            default: PERSON
            description: Discriminator value. Must be 'PERSON'.
            example: PERSON
          identification:
            type: string
            format: uuid
            description: System-assigned identifier of this participant.
            readOnly: true
          externalIdentifier:
            type: string
            description: External reference from your system.
            example: crm-4711
            maxLength: 50
            minLength: 0
            pattern: '[a-zA-Z0-9._~-]+'
          firstName:
            type: string
            description: First name.
            example: John
            maxLength: 64
            minLength: 0
          lastName:
            type: string
            description: Last name.
            example: Doe
            maxLength: 64
            minLength: 0
          email:
            type: string
            format: email
            description: Email address (RFC 5322).
            example: john.doe@example.com
            maxLength: 254
            minLength: 0
          mobile:
            type: string
            description: Mobile number in E.164 format.
            example: '+41791234567'
            maxLength: 16
      description: Human participant who does not sign. The 'type' discriminator must be 'PERSON'.
      required:
      - type
      title: Person
    Error:
      type: object
      description: Error object returned in case of an unsuccessful request.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of this error for log correlation.
          example: b4a7e3c4-1234-4a12-9c3d-5df1f7b2c8f4
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error (UTC, ISO 8601).
          example: '2025-09-24T14:32:07Z'
        name:
          type: string
          description: Logical error name derived from the thrown exception class name (without 'Exception' suffix).
          example: OrganizationNotFound
        message:
          type: string
          description: Human-readable explanation of the error.
          example: The requested organization does not exist.
        path:
          type: string
          description: Path of the request that caused the error.
          example: /api/process
        httpStatus:
          type: integer
          format: int32
          description: HTTP status code of the error.
          example: 409
        clientSubject:
          type: string
          description: Short subject/title of the error for client display.
          example: Organization not found
        clientBody:
          type: string
          description: Detailed description of the error for client display.
          example: The requested organization could not be located. Please verify the ID.
    FileSignaturePosition:
      type: object
      description: Represents the position of a signature in a file attachment.
      properties:
        signer:
          type: string
          description: 'Identifier of the signer. Either:

            - the internal `identification` (UUID as string), e.g. `02c2f3cc-e263-40c9-b458-79c014a153a2`

            - or the `externalIdentifier` from your system (string, up to 128 characters)

            '
          example: 02c2f3cc-e263-40c9-b458-79c014a153a2
          maxLength: 128
          minLength: 0
        pageNumber:
          type: integer
          format: int32
          description: 'Zero-based index of the page. Negative values count backwards. Examples:

            - `0` = first page

            - `1` = second page

            - `2` = third page

            - ...

            - `-2` = second to last page

            - `-1` = last page

            '
          example: -1
        positionX:
          type: integer
          format: int32
          description: X-coordinate (in pixels) of the top-left corner of the signature field.
          example: 150
          minimum: 0
        positionY:
          type: integer
          format: int32
          description: Y-coordinate (in pixels) of the top-left corner of the signature field.
          example: 300
          minimum: 0
        stickerProvider:
          type: string
          description: Specifies which sticker renderer to use for this signature position. Default is VISUAL_SIGNATURE_PROVIDER.
          enum:
          - VISUAL_SIGNATURE_PROVIDER
          - CUSTOM_VISUAL_SIGNATURE_PROVIDER
          example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      required:
      - pageNumber
      - positionX
      - positionY
      - signer
    TagSignaturePosition:
      allOf:
      - $ref: '#/components/schemas/FileSignaturePositionInput'
      - type: object
        properties:
          signer:
            type: string
            description: Identifier of the signer (UUID or externalIdentifier).
            example: 02c2f3cc-e263-40c9-b458-79c014a153a2
            maxLength: 128
            minLength: 0
          locator:
            type: string
            description: Discriminator. Must be 'TAG'.
            enum:
            - COORDINATES
            - TAG
            example: TAG
          offsetX:
            type: integer
            format: int32
            description: 'Optional X offset in PDF points applied to the resolved tag position. Positive = shift right, negative = shift left. Range: -200 to 200.'
            example: 0
            maximum: 200
            minimum: -200
          offsetY:
            type: integer
            format: int32
            description: 'Optional Y offset in PDF points applied to the resolved tag position. Positive = shift down, negative = shift up. Range: -200 to 200.'
            example: 0
            maximum: 200
            minimum: -200
          stickerProvider:
            type: string
            description: 'Sticker renderer to use. Default: VISUAL_SIGNATURE_PROVIDER.'
            enum:
            - VISUAL_SIGNATURE_PROVIDER
            - CUSTOM_VISUAL_SIGNATURE_PROVIDER
            example: CUSTOM_VISUAL_SIGNATURE_PROVIDER
      description: Signature position located by searching for a default tag string in the PDF (\s1\ for index 0, \s2\ for index 1, etc.). The tag marks the upper-left corner of the signature field.
      required:
      - signer
      title: TagSignaturePosition
    FileAttachResponse:
      type: object
      description: Response object returned when a file is attached to a process.
      example:
        fileId: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
      properties:
        fileId:
          type: string
          format: uuid
          description: System-assigned identifier of the attached file.
          example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
    Signer:
      type: object
      description: Human participant who signs. The 'type' discriminator must be 'SIGNER'.
      properties:
        type:
          type: string
          default: SIGNER
          description: Discriminator value. Must be 'SIGNER'.
          example: SIGNER
        identification:
          type: string
          format: uuid
          description: System-assigned identifier of this signer.
          readOnly: true
        externalIdentifier:
          type: string
          description: External reference from your system.
          example: crm-4711
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        firstName:
          type: string
          description: First name.
          example: John
          maxLength: 64
          minLength: 0
        lastName:
          type: string
          description: Last name.
          example: Doe
          maxLength: 64
          minLength: 0
        email:
          type: string
          format: email
          description: Email address (RFC 5322).
          example: john.doe@example.com
          maxLength: 254
          minLength: 0
        mobile:
          type: string
          description: 'Mobile number in E.164 format (no spaces or dashes).

            - Authorization behavior: If a mobile number is provided, the fallback code authorization uses an SMS code.

            - Signing behavior: If the number is a Swiss mobile (+41…), it will be preselected for ADVANCED signatures and cannot be changed in the UI.

            '
          example: '+41791234567'
          maxLength: 16
        role:
          type: string
          description: Role or function of the signer.
          example: Chief Signing Officer (CSO)
          maxLength: 256
          minLength: 0
        verification:
          $ref: '#/components/schemas/Verification'
          description: 'Optional online identity verification requirement (GwG).

            If provided when creating the process, the signer must complete an online identification step before signing.

            Verification results (payload/files/timestamps) are generated by the system and are read-only.


            Only available for corporate tenants. Providing this attribute on a non-corporate tenant will cause the create

            request to be rejected with a validation error.

            '
        status:
          type: string
          description: Current signer status.
          enum:
          - WAITING
          - PENDING
          - SIGNED
          - CANCELED
          - DECLINED
          - REMOVED
          - REPLACED
          example: PENDING
          readOnly: true
        signedOn:
          type: string
          format: date-time
          description: Timestamp when the signer completed signing (UTC). Only present if status is SIGNED.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        discontinuedOn:
          type: string
          format: date-time
          deprecated: true
          description: 'Timestamp when the signer has been discontinued (UTC). Only present if status is `CANCELED`. Deprecated: use `canceledOn` instead.'
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        canceledOn:
          type: string
          format: date-time
          description: Timestamp when the signer has been canceled (UTC). Only present if status is `CANCELED`.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        certificateName:
          type: string
          description: Full name extracted from the signing certificate. This field is populated only after the signer has successfully signed the process.It is absent if the signer has not signed yet or if the signing was performed without authentication or using mobile OTP authentication.
          readOnly: true
        certificateMatch:
          type: string
          description: Outcome of the comparison between the signer's declared full name and the name contained in the signing certificate. This field is populated only after the signer has successfully signed the process. If the signing was performed without authentication or using mobile OTP authentication, the value is set to `UNCHECKED`. Otherwise, the result is either `MATCH` or `MISMATCH`, depending on the comparison outcome.
          enum:
          - UNCHECKED
          - MATCH
          - MISMATCH
          example: MATCH
          readOnly: true
      required:
      - firstName
      - lastName
      - type
      title: Signer
    Invitees:
      type: object
      description: 'Invitees represent the **additional** signers to be invited for this process.

        The process `initiator` may optionally sign as well; if the initiator is a signer,

        they are **not** listed here again.

        '
      properties:
        personalMessage:
          type: string
          description: 'Personal message included in invitation emails.

            Plain text only: HTML tags are stripped. Use \n for line breaks.

            '
          example: Hello,\nplease review and sign the documents. Thank you!
          maxLength: 8192
          minLength: 0
        signers:
          type: array
          description: Additional signers to invite (excluding the initiator if the initiator also signs).
          items:
            $ref: '#/components/schemas/Signer'
            description: Additional signers to invite (excluding the initiator if the initiator also signs).
    ProcessSetupRequest:
      type: object
      description: Request model for the setup endpoint of a signing process.
      properties:
        language:
          type: string
          description: 'Preferred UI language (BCP-47). Allowed: en-GB, de-CH, fr-CH, it-CH.'
          example: en-GB
        backUrl:
          type: string
          description: 'Back URL: allows the user to return from the Swisscom Sign UI to the calling application.'
          example: https://customer.domain/sign/back
          maxLength: 2048
          minLength: 0
        successUrl:
          type: string
          description: 'Success URL: called after signing is completed. The document ID is transferred via query parameter. Must be a GET endpoint that issues a redirect back to the original application.'
          example: https://customer.domain/sign/success?id=3fa85f64-5717-4562-b3fc-2c963f66afad&participant=02c2f3cc-e263-40c9-b458-79c014a153a2
          maxLength: 2048
          minLength: 0
        authentication:
          $ref: '#/components/schemas/ProcessAuthentication'
          description: Authentication information (temporary App-only feature). Ignored for all other clients.
        scope:
          type: string
          description: 'Scope: defines the scopes that are requested on the token.'
          example: openid sswp:process:create sswp:process:execute sswp:process:manage sswp:process:read sswp:user:read sswp:user:write
          maxLength: 2048
        mode:
          type: string
          default: DEFAULT
          description: 'Mode: defines the display mode of the process page.'
          enum:
          - DEFAULT
          - EMBEDDED
          example: DEFAULT
    ProcessReleaseRequest:
      type: object
      description: 'Optional configuration for the release operation.


        **Notification behavior:**

        - Empty body → no notifications sent (legacy behavior)

        - `language` set (deprecated) → all participants notified in that language

        - `notification` object present → explicit control via `locale` and `suppress`


        **Migration from `language` to `notification`:**

        ```json

        // Old (deprecated):

        { "language": "de-CH" }


        // New (recommended):

        { "notification": { "locale": "de-CH" } }


        // Suppress specific types:

        { "notification": { "locale": "de-CH", "suppress": ["INVITE"] } }


        // Suppress all notifications:

        { "notification": { "locale": "de-CH", "suppress": ["ALL"] } }

        ```


        **Supported locales:** `en-GB`, `de-CH`, `fr-CH`, `it-CH` (BCP-47)

        '
      example:
        notification:
          locale: de-CH
          suppress:
          - INVITE
      properties:
        validUntil:
          type: string
          format: date-time
          description: 'Expiration timestamp of the process. After this point in time,

            the system automatically transitions the process status to `EXPIRED`.

            If not provided, the valid until date is automatically set to 30 days in the future.

            '
          example: '2026-12-31T23:59:59+01:00'
        language:
          type: string
          deprecated: true
          description: '**Deprecated:** Use `notification.locale` instead.


            Legacy behavior: Setting this field enables all notification types (`INVITE`, `COMPLETION`)

            for all participants in the specified language.


            If both `language` and `notification.locale` are provided, `notification.locale` takes precedence.


            Supported values: `en-GB`, `de-CH`, `fr-CH`, `it-CH` (BCP-47).

            '
          example: en-GB
        notification:
          $ref: '#/components/schemas/NotificationSettings'
          description: Notification settings for all participants
        signatureMethods:
          type: array
          description: 'Optional list of allowed signature methods for this process.

            If not provided, the tenant defaults are used.


            **Available methods:**

            * `APP` – Mobile app-based authentication via Swisscom Mobile ID.

            * `CLICK` – Click-to-sign: the signer confirms by clicking, without further authentication (SES only). Identity assurance is based on the process access authorization (e.g. email or SMS).

            * `OSS` – One-Shot Signing: on-the-fly authentication without prior device registration. Ideal for one-time or infrequent signers. **Corporate tenants only.**

            * `PASSKEY` – WebAuthn passkey authentication. **Corporate tenants only.**

            * `SMS` – One-time password (OTP) delivered via SMS.


            **Compatibility with signature levels:**

            * `SIMPLE` → `CLICK`

            * `ADVANCED` → `APP`, `OSS`, `PASSKEY`, `SMS`

            * `ADVANCED_EU` → `APP`, `OSS`, `PASSKEY`

            * `QUALIFIED` / `QUALIFIED_EU` → `APP`, `OSS`, `PASSKEY`

            '
          example:
          - APP
          - SMS
          items:
            type: string
            enum:
            - APP
            - SMS
            - CLICK
            - PASSKEY
            - OSS
          uniqueItems: true
    ProcessAuthentication:
      type: object
      description: 'INTERNAL ONLY: Authentication for the first-party namespace. Requests from other clients are ignored.'
      properties:
        identity:
          type: string
          format: uuid
          description: Caller-side user identifier (UUID).
          example: 69924099-a57a-44f8-8cf3-9324f4c93a92
        namespace:
          type: string
          description: Logical namespace of the first-party application (restricted).
          enum:
          - MSA
          - MSAINT
          example: MSAINT
      required:
      - identity
      - namespace
    Process:
      type: object
      description: 'A process represents an end-to-end signing flow with 1..n signers over 1..n documents.

        The initiator can optionally sign; additional signers are listed in `invitees`.

        '
      example:
        signatureLevel: QUALIFIED
        initiator:
          type: NON_PERSON
          externalIdentifier: ext-systems_oms-42
          name: Swisscom Sign Orchestrator
        invitees:
          personalMessage: Hello, please sign. Thank you!
          signers:
          - type: SIGNER
            firstName: John
            lastName: Doe
            email: john.doe@example.com
            status: PENDING
        properties:
        - key: contractType
          value: NDA
        - key: department
          value: Legal
        payload: '{ "caseId": "ABC-42", "priority": "HIGH" }'
        validUntil: '2025-12-31T23:59:59Z'
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned process identifier.
          readOnly: true
        status:
          type: string
          description: Current lifecycle state of the process.
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - EXPIRED
          example: PENDING
          readOnly: true
        signatureLevel:
          type: string
          default: QUALIFIED
          description: Legal quality of the signature(s).
          enum:
          - SIMPLE
          - ADVANCED
          - ADVANCED_EU
          - QUALIFIED
          - QUALIFIED_EU
          example: QUALIFIED
        initiator:
          description: 'Identifies the process initiator.

            One of:

            * NonPerson – technical/app initiator (no signature).

            * Person – human initiator (no signature). Either the email address or the first and last name must be specified.

            * Signer – initiator is also a signer.

            '
          oneOf:
          - $ref: '#/components/schemas/NonPerson'
          - $ref: '#/components/schemas/Person'
          - $ref: '#/components/schemas/Signer'
        invitees:
          $ref: '#/components/schemas/Invitees'
          description: Additional signers to invite (initiator not repeated here).
        teamId:
          type: string
          format: uuid
          description: Optional identifier of an existing team to which the process will be assigned. The team must be created in the cockpit beforehand and the teamId can be retrieved there. If provided, the process will be visible to all members of the specified team. The team assignment cannot be modified after the process is created.
        properties:
          type: array
          description: Optional custom metadata as key/value pairs attached to the process. Keys must be unique. Maximum of 8 entries.
          items:
            $ref: '#/components/schemas/Property'
            description: Optional custom metadata as key/value pairs attached to the process. Keys must be unique. Maximum of 8 entries.
          maxItems: 8
          minItems: 0
        payload:
          type: string
          description: Optional opaque application payload for correlation/auditing. May contain a JSON string.
          example:
            caseId: ABC-42
            priority: HIGH
          maxLength: 8192
          minLength: 0
        validUntil:
          type: string
          format: date-time
          description: 'Expiration timestamp of the process. After this point in time,

            the system automatically transitions the process status to `EXPIRED`.

            '
          example: '2025-12-31T23:59:59Z'
          readOnly: true
        createdDate:
          type: string
          format: date-time
          description: Creation timestamp (UTC).
          readOnly: true
        lastModifiedDate:
          type: string
          format: date-time
          description: Last modification timestamp (UTC).
          readOnly: true
        archiveOn:
          type: string
          format: date-time
          description: Scheduled archival time, if any (UTC).
          readOnly: true
        archivedOn:
          type: string
          format: date-time
          description: Actual time when archival happened, if archived (UTC).
          readOnly: true
        fileReferences:
          type: array
          description: Uploaded files incl. visual signature positions (read-only).
          items:
            $ref: '#/components/schemas/FileReference'
            description: Uploaded files incl. visual signature positions (read-only).
          readOnly: true
        partnerId:
          type: string
          description: Optional partner identifier. If provided, it must reference an existing partner.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        authorization:
          type: string
          default: CODE
          description: 'Authorization requirements for accessing the process.

            '
          enum:
          - CODE
          - ACCOUNT
          example: CODE
          writeOnly: true
      required:
      - initiator
    FileReference:
      type: object
      description: Reference to an uploaded file with its versions and signature positions.
      properties:
        externalIdentifier:
          type: string
          description: External reference identifier provided by the client system for correlation.
          example: contract-2025-Q1
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        initialFileId:
          type: string
          format: uuid
          description: System-generated UUID of the initial file uploaded to the process.
          example: 11111111-2222-3333-4444-555555555555
        lastSignedFileId:
          type: string
          format: uuid
          description: System-generated UUID of the last signed file (after the most recent signature).
          example: 66666666-7777-8888-9999-aaaaaaaaaaaa
        signaturePositions:
          type: array
          description: List of positions where signatures are placed in the file.
          example:
          - signer: 02c2f3cc-e263-40c9-b458-79c014a153a2
            pageNumber: -1
            positionX: 150
            positionY: 300
          items:
            $ref: '#/components/schemas/FileSignaturePosition'
    NotificationSettings:
      type: object
      description: 'Controls email notification behavior for all participants.


        **Default behavior:** All notification types (`INVITE`, `COMPLETION`) are sent to all participants.


        **Opt-out:** Use `suppress` to disable specific types or `ALL` to disable all notifications.

        '
      properties:
        locale:
          type: string
          description: Locale for all notification emails (BCP-47 format).
          enum:
          - en-GB
          - de-CH
          - fr-CH
          - it-CH
          example: de-CH
          minLength: 1
        suppress:
          type: array
          description: 'Notification types to suppress (opt-out).


            - Omit or empty → all notifications sent

            - `["INVITE"]` → only `COMPLETION` sent

            - `["COMPLETION"]` → only `INVITE` sent

            - `["ALL"]` → no notifications sent

            '
          example:
          - INVITE
          items:
            type: string
            description: 'The supported notification types:


              * `ALL` – Notifies the participant at all relevant stages of the process.

              * `INVITE` – Notifies the participant as soon as the process is released.

              * `COMPLETION` – Notifies the participant once the process has been completed.

              '
            enum:
            - ALL
            - INVITE
            - COMPLETION
            example: INVITE
            uniqueItems: true
          uniqueItems: true
        reminder:
          $ref: '#/components/schemas/ReminderSettings'
          description: Optional automatic reminder configuration for pending participants.
      required:
      - locale
      title: NotificationSettings
    Participant:
      description: Polymorphic participant. The 'type' discriminator selects the concrete shape.
      discriminator:
        propertyName: type
        mapping:
          NON_PERSON: '#/components/schemas/NonPerson'
          PERSON: '#/components/schemas/Person'
          SIGNER: '#/components/schemas/Signer'
      properties:
        type:
          type: string
      required:
      - type
    ProcessSetupResponse:
      type: object
      description: Represents the response for process setup.
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned process identifier.
          example: 21c2f3cc-e263-40c9-b458-79c014a153a1
        url:
          type: string
          description: URL to the Swisscom Sign UI for completing the setup of the process.
          example: https://test.sign.swisscom.ch/cockpit/process/21c2f3cc-e263-40c9-b458-79c014a153a1
    ReleaseResponse:
      type: object
      description: 'Response returned after successfully releasing a signing process.


        Contains the process identifier, its current lifecycle status, and

        participant-specific access URLs that can be used to redirect users

        to the signing UI.

        '
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned identifier of the released process.
          example: 6f1a5c4d-2d9a-4f12-a1c5-bc6e2bcb2d6a
          readOnly: true
        status:
          type: string
          description: Lifecycle status after release. Typically `PENDING` (waiting for signatures).
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - EXPIRED
          example: PENDING
          readOnly: true
        participants:
          type: array
          description: 'List of participants with their personalized access URLs.


            Each participant receives a unique URL that can be used to redirect them

            to the Swisscom Sign UI for signing. URLs are permanent and do not expire.

            '
          items:
            $ref: '#/components/schemas/ReleasedParticipant'
          readOnly: true
    NonPerson:
      allOf:
      - $ref: '#/components/schemas/Participant'
      - type: object
        properties:
          type:
            type: string
            default: NON_PERSON
            description: Discriminator value. Must be 'NON_PERSON'.
            example: NON_PERSON
          identification:
            type: string
            format: uuid
            description: System-assigned identifier of this participant.
            readOnly: true
          externalIdentifier:
            type: string
            description: External reference from your system for correlation.
            example: ext-crm
            maxLength: 50
            minLength: 0
            pattern: '[a-zA-Z0-9._~-]+'
          name:
            type: string
            description: Display name of the technical system.
            example: Swisscom Sign Orchestrator
            maxLength: 50
            minLength: 0
      description: Technical participant (non-human). The 'type' discriminator must be 'NON_PERSON'.
      required:
      - name
      - type
      title: NonPerson
    Property:
      type: object
      description: 'A single property (key/value) that can be attached to the process.

        Keys must be unique within the process.

        '
      example:
        key: contractType
        value: NDA
      properties:
        key:
          type: string
          description: Unique property key (case-sensitive).
          example: contractType
          maxLength: 64
          minLength: 0
        value:
          type: string
          description: Property value.
          example: NDA
          maxLength: 64
          minLength: 0
      required:
      - key
      - value
    Verification:
      type: object
      description: "Online identity verification (GwG) for a signer.\n\nOnly available for clients of type `Corporate`. Providing this object in non-corporate context will cause\nthe create request to be rejected with a validation error.\n\nUsage (input):\n- To enforce GwG identification, include this object in the signer when creating the process.\n  Presence of this object (even as an empty object) enables the online identification requirement.\n- `residentPermit` configures the verification flow. If omitted, the system defaults to `true`.\n\nOutcome (read-only):\n- Pending: both `verifiedOn` and `rejectedOn` are null.\n- Approved: `verifiedOn` is set and result artifacts may be available.\n- Rejected: `rejectedOn` is set. In this case, typically only `payload` is present.\n\nResult artifacts (read-only):\n- `payload` contains the provider result as a JSON string (system integrators only).\n- `files` may contain references to a PDF report and a ZIP bundle provided by the verification provider.\n  Files can be downloaded via `GET /api/process/{processId}/file/{fileId}`.\n  The PDF is additionally attached to the process as a document and must be signed together with the other documents.\n"
      properties:
        processId:
          type: string
          description: Verification process identifier at the provider (read-only).
          example: 43c2f3cc-e263-40c9-b458-79c014a153a1
          maxLength: 36
          minLength: 0
          readOnly: true
        verifiedOn:
          type: string
          format: date-time
          description: Timestamp when verification was approved (UTC, read-only). Mutually exclusive with `rejectedOn`.
          example: '2025-09-24T14:32:07Z'
          readOnly: true
        rejectedOn:
          type: string
          format: date-time
          description: Timestamp when verification was rejected (UTC, read-only). Mutually exclusive with `verifiedOn`.
          example: '2025-09-24T15:10:22Z'
          readOnly: true
        payload:
          type: string
          description: 'Provider result payload as JSON string (read-only).

            Present for approved or rejected verifications. Intended for system integrators.

            '
          example:
            result: APPROVED
            score: 0.98
          maxLength: 20000
          minLength: 0
          readOnly: true
        files:
          type: array
          description: 'File references created by the verification provider (read-only), e.g. PDF report and/or ZIP bundle.

            Download via `GET /api/process/{processId}/file/{fileId}`.

            '
          items:
            type: string
            format: uuid
            description: File identifier (UUID) provided by the verification provider.
            example: 4ac2f3cc-e263-40c9-b458-79c014a153a1
            readOnly: true
          readOnly: true
        residentPermit:
          type: boolean
          default: true
          description: 'Whether a Swiss residence permit is required for the signer.


            Input parameter used to configure the online identification flow.

            If omitted, the system defaults to `true`.

            '
          example: true
      title: Verification
    ReminderSettings:
      type: object
      description: Automatic reminder configuration for pending participants.
      properties:
        interval:
          type: string
          description: 'Interval between recurring reminders as ISO 8601 duration. Minimum: P1D, Maximum: P30D.'
          example: P3D
        beforeExpiry:
          type: array
          description: One or more points in time before expiry at which to send a reminder, expressed as ISO 8601 durations. Each value must be between P1D and P30D.
          example:
          - P5D
          - P1D
          items:
            type: string
    ReleasedParticipant:
      type: object
      description: Participant-specific details returned on process release (e.g., permanent access URL).
      properties:
        id:
          type: string
          format: uuid
          description: System-assigned identifier of the participant.
          example: 02c2f3cc-e263-40c9-b458-79c014a153a2
          readOnly: true
        externalIdentifier:
          type: string
          description: External reference of the participant as provided by the client system.
          example: crm-4711
          maxLength: 128
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
          readOnly: true
        url:
          type: string
          description: 'Permanent participant-specific URL to open the signing process.

            The link can be embedded in e-mails or client applications.

            When opened, the participant must still pass the regular

            authorization/identification flow in the process.

            '
          example: https://test.sign.swisscom.ch/cockpit/process/21c2f3cc-e263-40c9-b458-79c014a153a1/person/02c2f3cc-e263-40c9-b458-79c014a153a2
          maxLength: 2048
          minLength: 0
          readOnly: true
    FileSignaturePositionInput:
      description: "Polymorphic signature position for the attach request (write-only).\n\nThe 'locator' field selects the concrete shape:\n  - COORDINATES (default): place the signature at an explicit page and coordinate.\n  - TAG: resolve the position at runtime by searching for a tag string in the PDF\n    (e.g. \\s1\\ for the first signer).\n\nWhen 'locator' is omitted the request is treated as COORDINATES.\n"
      discriminator:
        propertyName: locator
        mapping:
          COORDINATES: '#/components/schemas/CoordinateSignaturePosition'
          TAG: '#/components/schemas/TagSignaturePosition'
      properties:
        locator:
          type: string
      required:
      - locator
    FileAttachment:
      type: object
      description: Represents the configuration for attaching a PDF to a Process
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned file identifier.
          example: c9e8d8ed-8a0a-4f5b-8f18-2c95c8fa8d1e
          readOnly: true
        name:
          type: string
          description: Original filename of the PDF.
          example: contract.pdf
          maxLength: 255
          minLength: 0
        content:
          type: string
          format: byte
          description: 'Content of the PDF as Base64 (OpenAPI format: byte). Max 40 MiB raw.'
          example: 
          maxLength: 55924053
          minLength: 0
        contentType:
          type: string
          description: MIME type of the uploaded file. Must be 'application/pdf'.
          example: application/pdf
          maxLength: 50
          minLength: 0
          pattern: ^application/pdf$
        externalIdentifier:
          type: string
          description: Optional client-defined identifier to reference this file.
          example: contract-2025-Q1
          maxLength: 50
          minLength: 0
          pattern: '[a-zA-Z0-9._~-]+'
        signaturePositions:
          type: array
          description: Optional signature positions for this PDF (write-only). Each entry is either a CoordinateSignaturePosition or a TagSignaturePosition. Omitting 'locator' defaults to COORDINATES.
          items:
            oneOf:
            - $ref: '#/components/schemas/CoordinateSignaturePosition'
            - $ref: '#/components/schemas/TagSignaturePosition'
          writeOnly: true
      required:
      - content
      - contentType
      - name
  securitySchemes:
    SwisscomSignOAuth2:
      type: oauth2
      description: OAuth 2.0 Client Credentials flow for accessing the Swisscom Sign Integration API.
      flows:

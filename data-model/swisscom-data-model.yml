  - from: FileSignaturePosition
    to: Signer
    type: belongs_to
    via: signer
  - from: ProcessPage
    to: Process
    type: has_many
    via: content
  - from: ProcessPage
    to: PageMetadata
    type: has_one
    via: page
  - from: ProcessReleaseRequest
    to: NotificationSettings
    type: has_one
    via: notification
  - from: NotificationSettings
    to: ReminderSettings
    type: has_one

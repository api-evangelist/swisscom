    type: has_one
    via: verification
  - from: FileReference
    to: FileSignaturePosition
    type: has_many
    via: signaturePositions
  - from: FileReference
    to: FileAttachment
    type: belongs_to
    via: initialFileId
  - from: FileReference
    to: FileAttachment
    type: belongs_to
    via: lastSignedFileId
  - from: FileAttachment

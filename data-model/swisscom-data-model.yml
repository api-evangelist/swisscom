  - from: AuditSuccessRecordResponse
    to: AuditRecord
    type: has_many
    via: records
  - from: ProcessSetupRequest
    to: ProcessAuthentication
    type: has_one
    via: authentication
  - from: ProcessOpenRequest
    to: ProcessAuthentication
    type: has_one
    via: authentication
- api: Swisscom All-in Signing Service (AIS)
  spec: openapi/swisscom-all-in-signing-service-openapi.yml
  root_entity: SignDocRequest
  identifier_format: uuid (requestID / responseID correlation pair)
  entities:
  - name: SignDocRequest
    description: >-
      ETSI TS 119 432 signature creation request carrying the SAD, requestID, credentialID, profile,
      signatureFormat, conformanceLevel and the document digests.
  - name: DocumentDigests
    description: hashAlgorithmOID plus the list of base64 document hashes to be signed.
  - name: SignDocResponse
    description: responseID, the returned SignatureObject list, and validation info.
  - name: ValidationInfo
    description: OCSP responses and CRLs supporting long-term validation of the signature.
  - name: ErrorResponse
    description: Error body returned for 4XX/5XX.
  relationships:
  - from: SignDocRequest
    to: DocumentDigests
    type: has_one
    via: documentDigests
  - from: SignDocResponse
    to: ValidationInfo
    type: has_one
    via: validationInfo
  - from: SignDocResponse
    to: SignDocRequest
    type: belongs_to
    via: responseID
    note: responseID echoes the caller's requestID.
